<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>因數倍數小冒險 V5</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#edf7ff,#fff7e8);color:#26344a}
.app{max-width:900px;margin:auto;padding:18px}header,.screen{background:#fff;border-radius:24px;box-shadow:0 8px 28px #0001}
header{padding:20px 24px;margin-bottom:16px}.screen{padding:24px}h1{margin:0;color:#6548e8;font-size:clamp(28px,6vw,44px)}
.subtitle{color:#667085;margin-top:5px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.badge{background:#f1edff;padding:8px 14px;border-radius:999px;font-weight:800}.hidden{display:none!important}
.btn{border:0;border-radius:16px;padding:13px 20px;font-size:18px;font-weight:900;cursor:pointer;background:#6548e8;color:white;box-shadow:0 5px 0 #4933b5}
.btn.next{background:#1f8f4e;box-shadow:0 5px 0 #156c39}.btn.secondary{background:#eef1f7;color:#26344a;box-shadow:0 5px 0 #d5dbe7}.btn:disabled{opacity:.6}
.progress{height:12px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-bottom:8px}.bar{height:100%;background:#6548e8;transition:.3s}
.progressText{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800;color:#536075;margin-bottom:18px}
.timerRow{display:flex;justify-content:center;margin:8px 0 18px}.timer{font-size:28px;font-weight:1000;background:#eef1f7;border-radius:999px;padding:8px 22px;min-width:150px;text-align:center}
.timer.warning{background:#fff0cf}.timer.danger{background:#ffe0e0;color:#c62828;animation:pulse .6s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}.question{text-align:center;font-size:27px;font-weight:900;margin:18px 0}
.big{font-size:54px;color:#6548e8}.tip,.feedback{padding:14px;border-radius:16px;background:#f6f7fb;margin:14px 0;line-height:1.6}
.good{background:#e7f9eb;color:#166534}.bad{background:#fff0f0;color:#9f1239}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px;margin:18px 0}
.num{border:2px solid #dce2ee;background:#fafbff;border-radius:16px;padding:15px 8px;font-size:21px;font-weight:900;cursor:pointer}
.num.selected{background:#e9e4ff;border-color:#8068ee}.num.correct{background:#dcf8e2!important;border:3px solid #32a852!important}
.num.wrong,.num.missed{background:#ffe7e7!important;border:3px solid #e24b4b!important}.num:disabled{cursor:default}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:560px;margin:20px auto}
.answer{padding:18px;border:2px solid #dce2ee;border-radius:18px;background:#fff;font-size:21px;font-weight:900;cursor:pointer}
.answer.correct{background:#dcf8e2;border:3px solid #32a852}.answer.wrong{background:#ffe7e7;border:3px solid #e24b4b}
.center{text-align:center}.stars{font-size:48px}.result-score{font-size:22px;font-weight:900}
@media(max-width:600px){.app{padding:10px}.screen,header{padding:18px}.answers{grid-template-columns:1fr}.progressText{font-size:14px}}
</style></head><body><div class="app">
<header><h1>🧭 因數倍數小冒險</h1><div class="subtitle">小五數學探險隊</div><div class="stats">
<div class="badge">⭐ 目前得分：<span id="score">0</span> 分</div><div class="badge">🎯 每題：20 分</div><div class="badge">🏅 關卡：<span id="stage">準備中</span></div></div></header>

<section id="home" class="screen"><h2>🎒 準備好開始了嗎？</h2><p>共有 <b>12 題</b>，每題 <b>20 分</b>。</p>
<div class="tip">⏱️ 第一關 20 秒／題　｜　第二關 20 秒／題　｜　第三關 10 秒／題</div>
<button class="btn" onclick="startGame()">開始冒險！</button></section>

<section id="game" class="screen hidden"><div class="progress"><div id="bar" class="bar"></div></div>
<div class="progressText"><span id="qp">第 1 / 12 題</span><span>每題 20 分</span></div>
<div class="timerRow"><div id="timer" class="timer">⏱️ 40 秒</div></div><div id="content"></div></section>

<section id="result" class="screen hidden center"><div id="stars" class="stars"></div><h2>🎉 冒險完成！</h2><div id="resultText"></div>
<button class="btn" onclick="startGame()">再玩一次</button> <button class="btn secondary" onclick="home()">回首頁</button></section>
</div>

<script>
let score=0,stage=1,q=0,locked=false,timerId=null,timeLeft=0,currentData=null;
const perStage=4,point=20,total=12,timeLimits=[20,20,10];
const stages=["因數獵人","倍數跑酷","因數倍數大對決"];
const $=x=>document.getElementById(x),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function factors(n){let r=[];for(let i=1;i<=n;i++)if(n%i===0)r.push(i);return r}
function qno(){return(stage-1)*perStage+q+1}
function startGame(){stopTimer();score=0;stage=1;q=0;locked=false;$("score").textContent=0;$("home").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");render()}
function home(){stopTimer();$("game").classList.add("hidden");$("result").classList.add("hidden");$("home").classList.remove("hidden");$("stage").textContent="準備中";$("score").textContent=0}
function updateProgress(){let n=qno();$("bar").style.width=((n-1)/total*100)+"%";$("qp").textContent=`第 ${n} / ${total} 題`;$("stage").textContent=stages[stage-1];$("score").textContent=score}
function render(){stopTimer();locked=false;updateProgress();if(stage===1)factorQ();else if(stage===2)multipleQ();else relationQ();startTimer()}
function startTimer(){timeLeft=timeLimits[stage-1];updateTimer();timerId=setInterval(()=>{if(locked)return;timeLeft--;updateTimer();if(timeLeft<=0)timeUp()},1000)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function updateTimer(){let e=$("timer");e.textContent=`⏱️ ${timeLeft} 秒`;e.classList.remove("warning","danger");if(timeLeft<=5)e.classList.add("danger");else if(timeLeft<=10)e.classList.add("warning")}
function nextButton(){return `<div class="center" style="margin-top:18px"><button class="btn next" onclick="next()">下一題 →</button></div>`}
function next(){stopTimer();q++;if(q>=perStage){if(stage<3){stage++;q=0}else{return finish()}}render()}
function toggle(b){if(locked)return;b.classList.toggle("selected");b.dataset.selected=b.classList.contains("selected")?"1":"0"}
function disable(s){document.querySelectorAll(s).forEach(x=>x.disabled=true)}
function pairs(n){let r=[];for(let i=1;i*i<=n;i++)if(n%i===0)r.push(`${i} × ${n/i}`);return r.join("、")}

function factorQ(){const list=[12,18,20,24,30,36,40,42,45,48],n=list[rand(0,list.length-1)],ans=factors(n);const pool=new Set(ans);while(pool.size<Math.min(16,ans.length+7))pool.add(rand(2,n+8));currentData={type:"factor",n,ans};const choices=shuffle([...pool]);
$("content").innerHTML=`<h2>🔎 因數獵人</h2><div class="question">找出 <span class="big">${n}</span> 的所有因數</div><div class="tip">💡 ${n} ÷ 某個數如果可以整除、沒有餘數，那個數就是 ${n} 的因數。</div><div class="grid">${choices.map(x=>`<button class="num" data-v="${x}" onclick="toggle(this)">${x}</button>`).join("")}</div><div id="fb" class="feedback">選好後按「檢查答案 →」。</div><div class="center"><button id="check" class="btn" onclick="checkFactors(${n})">檢查答案 →</button></div><div id="nextArea"></div>`}
function checkFactors(n){if(locked)return;locked=true;stopTimer();const ans=factors(n),buttons=[...document.querySelectorAll(".num")],chosen=buttons.filter(b=>b.dataset.selected==="1").map(b=>+b.dataset.v),ok=chosen.length===ans.length&&chosen.every(v=>ans.includes(v)),fb=$("fb");
buttons.forEach(b=>{let v=+b.dataset.v;if(ans.includes(v)){if(b.dataset.selected==="1")b.classList.add("correct");else b.classList.add("missed")}else if(b.dataset.selected==="1")b.classList.add("wrong")});
if(ok){score+=point;fb.className="feedback good";fb.innerHTML=`✅ 答對了！ <b>+${point} 分</b><br>正確因數：<b>${ans.join("、")}</b><br>乘法配對：${pairs(n)}<br>目前得分：<b>${score} 分</b>`}
else{fb.className="feedback bad";fb.innerHTML=`❌ 這題答錯了。<br>🔴 <b>紅框</b>表示漏選的因數或選錯的答案。<br>正確因數：<b>${ans.join("、")}</b><br>乘法配對：${pairs(n)}<br>目前得分：<b>${score} 分</b>`}
disable(".num");$("check").disabled=true;$("score").textContent=score;$("nextArea").innerHTML=nextButton()}
function timeUp(){if(locked)return;locked=true;stopTimer();const fb=$("fb");fb.className="feedback bad";fb.innerHTML=`⏰ <b>時間到！</b><br>這一題沒有得到分數。<br>請看看正確答案和解說，再按「下一題 →」。`;
if(currentData.type==="factor"){const ans=currentData.ans;document.querySelectorAll(".num").forEach(b=>{if(ans.includes(+b.dataset.v))b.classList.add("missed")});fb.innerHTML+=`<br>正確因數：<b>${ans.join("、")}</b><br>乘法配對：${pairs(currentData.n)}`;disable(".num")}
else if(currentData.type==="multiple"){const all=[...document.querySelectorAll(".num")],ans=all.map(b=>+b.dataset.v).filter(v=>v%currentData.n===0).sort((a,b)=>a-b);all.forEach(b=>{if(ans.includes(+b.dataset.v))b.classList.add("missed")});fb.innerHTML+=`<br>正確選項：<b>${ans.join("、")}</b>`;disable(".num")}
else{const cb=document.querySelector(`[data-a="${currentData.ans}"]`);if(cb)cb.classList.add("correct");fb.innerHTML+=`<br>正確答案：<b>${currentData.ans}</b><br>💡 可以用「能不能整除」來判斷。`;disable(".answer")}
const check=$("check");if(check)check.disabled=true;$("nextArea").innerHTML=nextButton()}

function multipleQ(){const n=rand(3,9),pool=new Set([n,2*n,3*n,4*n,5*n]);while(pool.size<12)pool.add(rand(4,55));currentData={type:"multiple",n};const choices=shuffle([...pool]);
$("content").innerHTML=`<h2>🏃 倍數跑酷</h2><div class="question">請找出 <span class="big">${n}</span> 的倍數</div><div class="tip">💡 ${n} 的倍數就是 ${n}×1、${n}×2、${n}×3……</div><div class="grid">${choices.map(x=>`<button class="num" data-v="${x}" onclick="toggle(this)">${x}</button>`).join("")}</div><div id="fb" class="feedback">選好後按「檢查答案 →」。</div><div class="center"><button id="check" class="btn" onclick="checkMultiples(${n})">檢查答案 →</button></div><div id="nextArea"></div>`}
function checkMultiples(n){if(locked)return;locked=true;stopTimer();const all=[...document.querySelectorAll(".num")],chosen=all.filter(b=>b.dataset.selected==="1").map(b=>+b.dataset.v),ans=all.map(b=>+b.dataset.v).filter(v=>v%n===0).sort((a,b)=>a-b),ok=chosen.length===ans.length&&chosen.every(v=>ans.includes(v)),fb=$("fb");
all.forEach(b=>{let v=+b.dataset.v;if(ans.includes(v)){if(b.dataset.selected==="1")b.classList.add("correct");else b.classList.add("missed")}else if(b.dataset.selected==="1")b.classList.add("wrong")});
if(ok){score+=point;fb.className="feedback good";fb.innerHTML=`✅ 答對了！ <b>+${point} 分</b><br>正確選項：<b>${ans.join("、")}</b><br>目前得分：<b>${score} 分</b>`}
else{fb.className="feedback bad";fb.innerHTML=`❌ 這題答錯了。<br>🔴 <b>紅框</b>表示漏選的倍數或選錯的答案。<br>正確選項：<b>${ans.join("、")}</b><br>目前得分：<b>${score} 分</b>`}
disable(".num");$("check").disabled=true;$("score").textContent=score;$("nextArea").innerHTML=nextButton()}

function relationQ(){const base=rand(4,9);let b,ans,m=rand(0,2);if(m===0){b=base*rand(2,6);ans="倍數"}else if(m===1){const fs=factors(base);b=fs[rand(0,fs.length-1)];ans="因數"}else{do{b=rand(2,50)}while(b%base===0||base%b===0);ans="都不是"}currentData={type:"relation",b,base,ans};
$("content").innerHTML=`<h2>⚔️ 因數倍數大對決</h2><div class="question"><span class="big">${b}</span> 和 <span class="big">${base}</span></div><div class="tip center">判斷：<b>${b}</b> 是 ${base} 的因數、倍數，還是都不是？</div><div class="answers"><button class="answer" data-a="因數" onclick="checkRelation(this,'因數','${ans}',${b},${base})">${b} 是 ${base} 的因數</button><button class="answer" data-a="倍數" onclick="checkRelation(this,'倍數','${ans}',${b},${base})">${b} 是 ${base} 的倍數</button><button class="answer" data-a="都不是" onclick="checkRelation(this,'都不是','${ans}',${b},${base})">都不是</button></div><div id="fb" class="feedback">選一個答案。</div><div id="nextArea"></div>`}
function checkRelation(btn,choice,ans,b,base){if(locked)return;locked=true;stopTimer();const fb=$("fb");if(choice===ans){score+=point;btn.classList.add("correct");fb.className="feedback good";fb.innerHTML=`✅ 答對了！ <b>+${point} 分</b><br>${b} 是 ${base} 的<b>${ans}</b>。<br>目前得分：<b>${score} 分</b>`}else{btn.classList.add("wrong");document.querySelector(`[data-a="${ans}"]`).classList.add("correct");fb.className="feedback bad";fb.innerHTML=`❌ 這題答錯了。<br>正確答案：<b>${ans}</b><br>💡 可以用「能不能整除」來判斷。<br>目前得分：<b>${score} 分</b>`}disable(".answer");$("score").textContent=score;$("nextArea").innerHTML=nextButton()}
function finish(){stopTimer();$("game").classList.add("hidden");$("result").classList.remove("hidden");const max=total*point,ratio=score/max,stars=ratio>=.85?3:ratio>=.6?2:1;$("stars").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);$("resultText").innerHTML=`<div class="result-score">${stars===3?"🏆 因數倍數大師！":stars===2?"🧭 數學探險家！":"🌱 勇敢的數學新手！"}</div><p>你的分數：<b>${score} / ${max}</b></p><p>總題數：${total} 題｜每題 ${point} 分</p>`;$("stage").textContent="完成"}
</script></body></html>
